  function makeStore(){
    var data = {};
    var api = {
      getItem: function(k){ return Object.prototype.hasOwnProperty.call(data, k) ? data[k] : null; },
      setItem: function(k, v){ data[k] = String(v); },
      removeItem: function(k){ delete data[k]; },
      clear: function(){ data = {}; },
      key: function(i){ return Object.keys(data)[i] || null; }

    var link = e.target.closest('a[href]');
    if (!link) return;
    var href = link.getAttribute('href');
    if (href === null) return;
    var isAnchor = href.startsWith('#') || href === '';

      e.preventDefault();

        history.replaceState(null, '', ' ');

          location.hash = href;
        }

      e.preventDefault();

<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atelier · 2026 春季 课程目录</title>
<style>
  /* ===========================================================
     ATELIER — 课程目录（横向滚动 · 鼠标滚轮 · 中央选中）
     视觉方向：浅色科技感
       bg  : 近白、极淡冷调
       ink : 深石板
       accent : 电光蓝
       font : 现代 sans + 等宽 metadata
     =========================================================== */
  :root {
    --bg:        oklch(98.5% 0.005 240);
    --surface:   oklch(100% 0 0);
    --ink:       oklch(20% 0.022 250);
    --muted:     oklch(48% 0.018 250);
    --hairline:  oklch(92% 0.005 240);
    --hairline-strong: oklch(82% 0.008 240);
    --accent:    oklch(60% 0.20 245);
    --accent-soft: oklch(94% 0.04 245);

    --card-w: 320px;
    --card-h: 440px;
    --card-gap: 32px;
    --header-h: 72px;
    --detail-h: 220px;
    --hud-h: 52px;

    --font-display: 'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif;
    --font-body:    'Inter', -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Hiragino Sans GB', system-ui, sans-serif;
    --font-mono:    ui-monospace, 'SF Mono', 'JetBrains Mono', 'IBM Plex Mono', Menlo, 'Cascadia Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    overflow: hidden;
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: "ss01", "cv11", "tnum";
  }

  /* ==== 浅色冷调科技感：点阵网格背景 ==== */
  body {
    display: flex;
    flex-direction: column;
    user-select: none;
    cursor: default;
    background-color: var(--bg);
    background-image:
      radial-gradient(circle at 1px 1px, oklch(88% 0.008 240) 1px, transparent 0);
    background-size: 24px 24px;
    background-position: -1px -1px;
  }

  /* ==== 顶部状态条 ==== */
  .masthead {
    height: var(--header-h);
    padding: 0 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--hairline);
    background: oklch(98.5% 0.005 240 / 0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    flex-shrink: 0;
    z-index: 10;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .brand-mark {
    width: 30px;
    height: 30px;
    border: 1.5px solid var(--ink);
    border-radius: 6px;
    position: relative;
    display: grid;
    place-items: center;
  }
  .brand-mark::before {
    content: "";
    width: 9px;
    height: 9px;
    background: var(--accent);
    border-radius: 2px;
  }

  .brand-name {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    letter-spacing: -0.022em;
    line-height: 1;
    color: var(--ink);
  }

  .brand-tag {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding-top: 2px;
  }

  .masthead-meta {
    display: flex;
    align-items: center;
    gap: 28px;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }

  .masthead-meta .item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .masthead-meta strong { color: var(--ink); font-weight: 600; }

  /* 脉动状态点 — 科技感 live indicator */
  .live-dot {
    width: 7px; height: 7px;
    background: var(--accent);
    border-radius: 50%;
    position: relative;
    display: inline-block;
  }
  .live-dot::before {
    content: "";
    position: absolute;
    inset: -3px;
    border-radius: 50%;
    background: var(--accent);
    opacity: 0.4;
    animation: pulse 1.8s ease-out infinite;
  }
  @keyframes pulse {
    0%   { transform: scale(0.8); opacity: 0.5; }
    80%  { transform: scale(2.2); opacity: 0; }
    100% { transform: scale(2.2); opacity: 0; }
  }

  /* ==== STAGE ==== */
  .stage {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }

  .carousel {
    flex: 1;
    position: relative;
    overflow: hidden;
    display: flex;
    align-items: center;
    min-height: 0;
  }

  /* 边缘冷调 fade */
  .carousel::before, .carousel::after {
    content: "";
    position: absolute;
    top: 0; bottom: 0;
    width: 120px;
    pointer-events: none;
    z-index: 5;
  }
  .carousel::before { left: 0; background: linear-gradient(to right, var(--bg) 25%, transparent); }
  .carousel::after  { right: 0; background: linear-gradient(to left, var(--bg) 25%, transparent); }

  /* 中央刻度线 — 视觉锚点 */
  .center-axis {
    position: absolute;
    top: 0; bottom: 0;
    left: 50%;
    width: 1px;
    background: var(--accent);
    opacity: 0.25;
    z-index: 4;
    pointer-events: none;
  }
  .center-axis::before, .center-axis::after {
    content: "";
    position: absolute;
    left: -3px;
    width: 7px;
    height: 7px;
    background: var(--accent);
    transform: rotate(45deg);
  }
  .center-axis::before { top: 12px; }
  .center-axis::after  { bottom: 12px; }

  .track {
    display: flex;
    gap: var(--card-gap);
    padding: 0 calc(50vw - var(--card-w) / 2);
    will-change: transform;
    align-items: center;
  }

  /* ==== 卡片 ==== */
  .card {
    flex-shrink: 0;
    width: var(--card-w);
    height: var(--card-h);
    background: var(--surface);
    border: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
    position: relative;
    cursor: pointer;
    overflow: hidden;
    transition:
      transform 0.55s cubic-bezier(0.2, 0.8, 0.2, 1),
      box-shadow 0.55s cubic-bezier(0.2, 0.8, 0.2, 1),
      opacity 0.55s cubic-bezier(0.2, 0.8, 0.2, 1),
      border-color 0.55s cubic-bezier(0.2, 0.8, 0.2, 1);
    opacity: 0.36;
    transform: scale(0.92) translateY(0);
    border-radius: 4px;
  }

  /* 卡片顶部 accent 线 */
  .card::before {
    content: "";
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--accent);
    transform: scaleX(0);
    transform-origin: left center;
    z-index: 5;
    transition: transform 0.45s cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .card.active::before { transform: scaleX(1); }

  /* 角标 — 科技感装饰，active 才显示 */
  .card-corner {
    position: absolute;
    width: 10px;
    height: 10px;
    border-color: var(--accent);
    border-style: solid;
    z-index: 6;
    opacity: 0;
    transition: opacity 0.35s ease;
  }
  .card-corner.tl { top: 8px;    left: 8px;    border-width: 1.5px 0 0 1.5px; }
  .card-corner.tr { top: 8px;    right: 8px;   border-width: 1.5px 1.5px 0 0; }
  .card-corner.bl { bottom: 8px; left: 8px;    border-width: 0 0 1.5px 1.5px; }
  .card-corner.br { bottom: 8px; right: 8px;   border-width: 0 1.5px 1.5px 0; }
  .card.active .card-corner { opacity: 1; }

  .card-cover {
    height: 58%;
    position: relative;
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    padding: 22px 22px 16px;
    overflow: hidden;
    border-bottom: 1px solid var(--hairline);
  }

  /* 封面内部网格 — 科技感装饰 */
  .card-cover::after {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(to right, var(--cover-grid, rgba(0,0,0,0.04)) 1px, transparent 1px),
      linear-gradient(to bottom, var(--cover-grid, rgba(0,0,0,0.04)) 1px, transparent 1px);
    background-size: 22px 22px;
    pointer-events: none;
  }

  .card-num {
    font-family: var(--font-display);
    font-size: 80px;
    font-weight: 600;
    line-height: 0.85;
    letter-spacing: -0.05em;
    color: var(--cover-fg, var(--ink));
    font-variant-numeric: tabular-nums;
    z-index: 1;
  }

  .card-mark {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    color: var(--cover-fg, var(--ink));
    z-index: 1;
  }
  .card-mark svg { width: 100%; height: 100%; display: block; }

  .card-meta-cover {
    position: absolute;
    bottom: 14px;
    left: 22px;
    right: 22px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--cover-fg, var(--ink));
    opacity: 0.78;
    z-index: 1;
  }

  .card-body {
    flex: 1;
    padding: 18px 22px 18px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    background: var(--surface);
  }

  .card-title {
    font-family: var(--font-display);
    font-size: 22px;
    font-weight: 600;
    line-height: 1.18;
    letter-spacing: -0.018em;
    color: var(--ink);
  }

  .card-sub {
    font-family: var(--font-body);
    font-size: 12px;
    color: var(--muted);
    line-height: 1.45;
    margin-top: 6px;
  }

  .card-foot {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .card-instructor {
    font-family: var(--font-body);
    font-size: 12.5px;
    color: var(--ink);
    line-height: 1.3;
    font-weight: 500;
  }
  .card-instructor .weeks {
    display: block;
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 3px;
    font-weight: 400;
  }

  .card-arrow {
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 13px;
    line-height: 1;
    transform: translateX(0);
    transition: transform 0.3s ease;
  }

  .card.active {
    opacity: 1;
    transform: scale(1.06) translateY(-14px);
    box-shadow:
      0 1px 0 0 var(--accent) inset,
      0 30px 60px -28px rgba(20, 30, 80, 0.35),
      0 12px 28px -16px rgba(20, 30, 80, 0.18);
    border-color: var(--accent);
    z-index: 2;
  }
  .card.adjacent { opacity: 0.7; }
  .card:hover .card-arrow { transform: translateX(4px); }

  /* ==== 详情区 ==== */
  .detail {
    height: var(--detail-h);
    border-top: 1px solid var(--hairline);
    padding: 24px 40px 22px;
    display: grid;
    grid-template-columns: 1.05fr 2.3fr 1.4fr;
    gap: 36px;
    background: oklch(99.5% 0.003 240);
    flex-shrink: 0;
    transition: opacity 0.25s ease;
    position: relative;
  }
  .detail.flash { opacity: 0.35; }

  .detail-col { transition: opacity 0.3s ease; }

  .kicker {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .kicker::before { content: "//"; color: var(--accent); }

  .code-block {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--ink);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .code-block .num { color: var(--accent); font-weight: 600; }
  .cat-block {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.22em;
    text-transform: uppercase;
  }
  .weeks-block {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--ink);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-top: 18px;
    padding-top: 14px;
    border-top: 1px solid var(--hairline);
  }

  .detail-title {
    font-family: var(--font-display);
    font-size: 30px;
    font-weight: 600;
    line-height: 1.12;
    letter-spacing: -0.025em;
    color: var(--ink);
    margin-bottom: 12px;
  }
  .detail-body {
    font-family: var(--font-body);
    font-size: 13.5px;
    line-height: 1.65;
    color: var(--ink);
    max-width: 64ch;
  }

  .dl {
    display: grid;
    grid-template-columns: auto 1fr;
    column-gap: 18px;
    row-gap: 9px;
    font-size: 12px;
  }
  .dl dt {
    font-family: var(--font-mono);
    font-size: 9.5px;
    color: var(--muted);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    padding-top: 2px;
  }
  .dl dd {
    font-family: var(--font-body);
    color: var(--ink);
    line-height: 1.4;
  }

  /* ==== 底部状态条 ==== */
  .hud {
    height: var(--hud-h);
    padding: 0 40px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-top: 1px solid var(--hairline);
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 0.22em;
    text-transform: uppercase;
    flex-shrink: 0;
    background: oklch(99% 0.003 240 / 0.85);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .hud-counter {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .hud-counter .num {
    color: var(--ink);
    font-weight: 600;
    font-size: 11px;
    font-variant-numeric: tabular-nums;
  }
  .hud-counter .total { color: var(--muted); }

  .hud-progress {
    width: 220px;
    height: 1px;
    background: var(--hairline-strong);
    position: relative;
    margin-left: 10px;
  }
  .hud-progress::before {
    content: "";
    position: absolute;
    top: 50%;
    left: 0;
    width: 8px; height: 8px;
    background: var(--accent);
    border-radius: 50%;
    transform: translate(calc(var(--progress, 0px) - 4px), -50%);
    transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: 0 0 0 4px oklch(60% 0.20 245 / 0.18);
  }

  /* 进度条刻度 */
  .hud-progress .tick {
    position: absolute;
    top: -2px;
    width: 1px;
    height: 5px;
    background: var(--hairline-strong);
  }
  .hud-progress .tick:nth-child(1) { left: 25%; }
  .hud-progress .tick:nth-child(2) { left: 50%; }
  .hud-progress .tick:nth-child(3) { left: 75%; }

  .hud-hint {
    display: flex;
    gap: 22px;
  }
  .hud-hint span {
    display: inline-flex;
    align-items: center;
    gap: 8px;
  }
  .hud-hint kbd {
    display: inline-block;
    padding: 2px 7px;
    border: 1px solid var(--hairline-strong);
    border-radius: 3px;
    font-family: var(--font-mono);
    font-size: 9.5px;
    color: var(--ink);
    text-transform: none;
    letter-spacing: 0;
    background: var(--surface);
  }

  /* ==== 自适应 ==== */
  @media (max-height: 780px) {
    :root { --card-h: 400px; --detail-h: 200px; }
  }
  @media (max-height: 660px) {
    :root { --card-h: 360px; --detail-h: 180px; --header-h: 60px; }
    .detail-title { font-size: 24px; }
  }
  @media (max-width: 1100px) {
    :root { --card-w: 280px; --card-gap: 24px; }
    .masthead, .hud { padding: 0 24px; }
    .detail { padding: 20px 24px 16px; gap: 22px; }
  }

  /* ==== 进场动画 ==== */
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .masthead, .carousel, .detail, .hud {
    animation: rise 0.7s cubic-bezier(0.2, 0.8, 0.2, 1) both;
  }
  .carousel { animation-delay: 0.05s; }
  .detail   { animation-delay: 0.15s; }
  .hud      { animation-delay: 0.22s; }
</style>

  const track      = document.getElementById('track');

  const detailEl   = document.getElementById('detail');
  const counterCur = document.getElementById('counter-cur');
  const counterTot = document.getElementById('counter-total');
  const progress   = document.getElementById('progress');

  const cardW      = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--card-w'));
  const cardGap    = parseInt(getComputedStyle(document.documentElement).getPropertyValue('--card-gap'));
  const STRIDE     = cardW + cardGap;
  const N          = courses.length;
  const MAX_SCROLL = (N - 1) * STRIDE;
  const DEFAULT_IDX = 4;
  const PROGRESS_W = 220;

  function renderCards() {
    track.innerHTML = courses.map((c, i) => `
      <article class="card" data-index="${i}" role="listitem" tabindex="0" aria-label="${c.title}, ${c.code}">
        <span class="card-corner tl"></span>
        <span class="card-corner tr"></span>

          </div>

              ${c.instructor}
              <span class="weeks">${c.weeks} · ${c.schedule}</span>
            </div>
            <span class="card-arrow">›</span>
          </div>
        </div>
      </article>
    `).join('');
  }

  function renderDetail(c) {
    detailEl.innerHTML = `
      <div class="detail-col">
        <div class="kicker">课程</div>
        <div class="code-block"><span class="num">${c.num}</span>  ${c.code}</div>
        <div class="cat-block">${c.cat}</div>
        <div class="weeks-block">${c.weeks}  ·  ${c.schedule}</div>
      </div>
      <div class="detail-col">
        <div class="kicker">概览</div>
        <div class="detail-title">${c.title}</div>
        <p class="detail-body">${c.description}</p>
      </div>

        <div class="kicker">信息</div>
        <dl class="dl">
          <dt>形式</dt><dd>${c.format}</dd>
          <dt>人数</dt><dd>${c.size}</dd>
          <dt>先修</dt><dd>${c.prereq}</dd>
          <dt>导师</dt><dd>${c.instructor}</dd>
        </dl>
      </div>
    `;
  }

  let currentX = -DEFAULT_IDX * STRIDE;
  let targetX  = -DEFAULT_IDX * STRIDE;
  let activeIdx = DEFAULT_IDX;
  const cards = [];

  function init() {
    renderCards();
    const cardEls = track.querySelectorAll('.card');
    cardEls.forEach((el, i) => {
      el.addEventListener('click', () => goTo(i));
      el.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goTo(i); }
      });
      cards.push(el);
    });
    counterTot.textContent = String(N).padStart(2, '0');
    setActive(DEFAULT_IDX, true);
    track.style.transform = `translate3d(${currentX}px, 0, 0)`;
    requestAnimationFrame(loop);
  }

  function goTo(i) {
    const idx = Math.max(0, Math.min(N - 1, i));
    targetX = -idx * STRIDE;
  }

  function step(dir) {
    goTo(activeIdx + dir);
  }

  function setActive(idx, immediate) {
    activeIdx = idx;
    cards.forEach((c, i) => {
      c.classList.toggle('active', i === idx);
      c.classList.toggle('adjacent', Math.abs(i - idx) === 1);
    });
    counterCur.textContent = String(idx + 1).padStart(2, '0');
    const t = (-currentX) / MAX_SCROLL;
    progress.style.setProperty('--progress', (t * (PROGRESS_W - 8)) + 'px');
    if (immediate) {
      renderDetail(courses[idx]);
    } else {
      detailEl.classList.add('flash');
      setTimeout(() => {
        renderDetail(courses[idx]);
        detailEl.classList.remove('flash');
      }, 140);
    }
  }

  function loop() {
    const k = 0.14;
    currentX += (targetX - currentX) * k;

    track.style.transform = `translate3d(${currentX}px, 0, 0)`;

    const idx = Math.round(-currentX / STRIDE);
    const clamped = Math.max(0, Math.min(N - 1, idx));
    if (clamped !== activeIdx) setActive(clamped, false);

    const t = Math.max(0, Math.min(1, (-currentX) / MAX_SCROLL));
    progress.style.setProperty('--progress', (t * (PROGRESS_W - 8)) + 'px');

    requestAnimationFrame(loop);
  }

  let wheelTimer = null;
  carousel.addEventListener('wheel', (e) => {
    e.preventDefault();
    const primary = Math.abs(e.deltaX) > Math.abs(e.deltaY) ? e.deltaX : e.deltaY;
    const scaled = primary * 1.15;
    targetX = Math.max(-MAX_SCROLL, Math.min(0, targetX - scaled));

    if (wheelTimer) clearTimeout(wheelTimer);
    wheelTimer = setTimeout(() => {
      const nearest = Math.round(-targetX / STRIDE);
      const c = Math.max(0, Math.min(N - 1, nearest));
      targetX = -c * STRIDE;
    }, 180);
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (e.target && (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA' || e.target.isContentEditable)) return;
    if (e.key === 'ArrowRight') { e.preventDefault(); step(1); }
    else if (e.key === 'ArrowLeft')  { e.preventDefault(); step(-1); }
    else if (e.key === 'Home')       { e.preventDefault(); goTo(0); }
    else if (e.key === 'End')        { e.preventDefault(); goTo(N - 1); }
  });

  let dragStart = null;
  let startX = 0;
  track.addEventListener('pointerdown', (e) => {
    dragStart = e.clientX;
    startX = currentX;
    track.setPointerCapture(e.pointerId);
  });
  track.addEventListener('pointermove', (e) => {
    if (dragStart == null) return;
    const dx = e.clientX - dragStart;
    targetX = Math.max(-MAX_SCROLL, Math.min(0, startX + dx));
  });
  track.addEventListener('pointerup', (e) => {
    if (dragStart == null) return;
    dragStart = null;
    const nearest = Math.round(-targetX / STRIDE);
    const c = Math.max(0, Math.min(N - 1, nearest));
    targetX = -c * STRIDE;
    track.releasePointerCapture(e.pointerId);
  });
  track.addEventListener('pointercancel', () => { dragStart = null; });

  window.addEventListener('resize', () => {
    targetX = -activeIdx * STRIDE;
  });

  init();
})();
</script>
