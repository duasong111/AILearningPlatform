<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=1920">
  <title>刷题练习 — AI 多智能体学习平台</title>
  <style>
    :root {
      --bg:       oklch(98.5% 0.003 250);
      --surface:  oklch(100% 0 0);
      --fg:       oklch(18% 0.012 250);
      --muted:    oklch(54% 0.012 250);
      --border:   oklch(91% 0.005 250);
      --accent:   oklch(56% 0.19 255);
      --accent-fg:oklch(100% 0 0);
      --accent-subtle:oklch(95% 0.03 255);
      --success:  oklch(52% 0.15 155);
      --success-subtle:oklch(96% 0.04 155);
      --warning:  oklch(68% 0.14 80);
      --warning-subtle:oklch(97% 0.04 80);
      --danger:   oklch(56% 0.20 25);
      --danger-subtle:oklch(96% 0.04 25);
      --font-display:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',system-ui,sans-serif;
      --font-body:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',system-ui,sans-serif;
      --font-mono:'JetBrains Mono','SF Mono','Cascadia Code',ui-monospace,Menlo,monospace;
      --radius-sm:6px; --radius-md:10px; --radius-lg:14px;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{width:1920px;height:1080px;overflow:hidden;background:var(--bg);color:var(--fg);font:15px/1.55 var(--font-body);-webkit-font-smoothing:antialiased;}
    button{font-family:inherit;cursor:pointer;}
    a{text-decoration:none;color:inherit;}

    /* ── Top bar ─────────────────────────────────── */
    .topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;padding:0 28px;gap:16px;z-index:10;position:relative;}
    .topbar-logo{display:flex;align-items:center;gap:10px;font:600 15px/1 var(--font-display);letter-spacing:-0.01em;}
    .topbar-logo svg{flex-shrink:0;}
    .topbar-sep{width:1px;height:20px;background:var(--border);}
    .topbar-nav{display:flex;gap:4px;}
    .topbar-nav a{font:500 13.5px/1 var(--font-body);color:var(--muted);padding:8px 14px;border-radius:var(--radius-sm);transition:all .15s;}
    .topbar-nav a:hover{color:var(--fg);background:oklch(96% .003 250);}
    .topbar-nav a.active{color:var(--accent);background:var(--accent-subtle);}
    .topbar-right{margin-left:auto;display:flex;align-items:center;gap:12px;}
    .avatar{width:32px;height:32px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;font:600 12px/1 var(--font-body);}
    .topbar-back{display:flex;align-items:center;gap:6px;font:500 13px/1 var(--font-body);color:var(--muted);padding:6px 12px;border-radius:var(--radius-sm);transition:all .15s;border:1px solid var(--border);}
    .topbar-back:hover{color:var(--accent);border-color:var(--accent);background:var(--accent-subtle);}

    /* ── Main grid ───────────────────────────────── */
    .main{display:grid;grid-template-columns:1fr 480px;height:calc(1080px - 56px);}

    /* ── Question panel ──────────────────────────── */
    .q-panel{display:flex;flex-direction:column;overflow:hidden;}
    .q-panel-scroll{flex:1;overflow-y:auto;padding:32px 48px 24px;}
    .q-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;}
    .q-head-left{display:flex;align-items:center;gap:12px;}
    .q-num{font:700 22px/1 var(--font-display);color:var(--fg);}
    .q-total{font:400 14px/1 var(--font-body);color:var(--muted);}
    .q-tags{display:flex;gap:8px;}
    .tag{font:500 11.5px/1 var(--font-body);padding:4px 10px;border-radius:999px;border:1px solid var(--border);color:var(--muted);background:var(--surface);}
    .tag.diff-easy{color:oklch(42% .12 155);border-color:oklch(85% .06 155);background:oklch(96% .03 155);}
    .tag.diff-med{color:oklch(52% .12 80);border-color:oklch(85% .06 80);background:oklch(96% .03 80);}
    .tag.diff-hard{color:oklch(48% .14 25);border-color:oklch(85% .06 25);background:oklch(96% .03 25);}
    .tag.bloom{color:oklch(50% .10 300);border-color:oklch(88% .04 300);background:oklch(97% .02 300);}
    .q-nav{display:flex;gap:6px;}
    .q-nav button{width:34px;height:34px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--muted);font:500 13px/1 var(--font-body);transition:all .15s;display:grid;place-items:center;}
    .q-nav button:hover{border-color:var(--accent);color:var(--accent);}
    .q-nav button:disabled{opacity:.3;cursor:default;}

    .progress{display:flex;gap:6px;margin-bottom:28px;}
    .progress-dot{width:100%;height:4px;border-radius:2px;background:var(--border);transition:background .2s;}
    .progress-dot.done{background:var(--success);}
    .progress-dot.current{background:var(--accent);}

    .q-body{margin-bottom:28px;}
    .q-title{font:600 20px/1.4 var(--font-display);color:var(--fg);margin-bottom:16px;letter-spacing:-0.01em;}
    .q-context{font:400 15px/1.7 var(--font-body);color:oklch(40% .012 250);margin-bottom:12px;}
    .q-code{font:13.5px/1.65 var(--font-mono);background:oklch(22% .015 250);color:oklch(88% .01 250);padding:18px 22px;border-radius:var(--radius-md);white-space:pre;overflow-x:auto;margin:16px 0;border:1px solid oklch(30% .015 250);}

    /* ── Input mode tabs ─────────────────────────── */
    .mode-bar{display:flex;align-items:center;gap:4px;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border);}
    .mode-tab{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:var(--radius-sm);border:1px solid transparent;background:transparent;color:var(--muted);font:500 13px/1 var(--font-body);transition:all .15s;}
    .mode-tab:hover{color:var(--fg);background:oklch(96% .003 250);}
    .mode-tab.active{color:var(--accent);background:var(--accent-subtle);border-color:oklch(88% .04 255);}
    .mode-tab svg{flex-shrink:0;opacity:.7;}
    .mode-label{font:500 12px/1 var(--font-body);color:var(--muted);margin-left:auto;}

    /* ── Choice cards ────────────────────────────── */
    .choices{display:flex;flex-direction:column;gap:10px;margin-bottom:24px;}
    .choice{display:flex;gap:14px;padding:14px 18px;border:1.5px solid var(--border);border-radius:var(--radius-md);background:var(--surface);cursor:pointer;transition:all .15s;}
    .choice:hover{border-color:oklch(80% .02 250);}
    .choice.selected{border-color:var(--accent);background:var(--accent-subtle);}
    .choice.correct{border-color:var(--success);background:var(--success-subtle);}
    .choice.wrong{border-color:var(--danger);background:var(--danger-subtle);}
    .choice-letter{width:28px;height:28px;border-radius:50%;border:1.5px solid var(--border);display:grid;place-items:center;font:600 13px/1 var(--font-mono);color:var(--muted);flex-shrink:0;transition:all .15s;}
    .choice.selected .choice-letter{border-color:var(--accent);color:var(--accent);background:oklch(92% .04 255);}
    .choice.correct .choice-letter{border-color:var(--success);color:var(--success);background:oklch(92% .06 155);}
    .choice.wrong .choice-letter{border-color:var(--danger);color:var(--danger);background:oklch(92% .06 25);}
    .choice-body{flex:1;}
    .choice-text{font:400 15px/1.5 var(--font-body);color:var(--fg);}
    .choice-sub{font:400 12.5px/1.5 var(--font-body);color:var(--muted);margin-top:4px;}

    /* ── Text / Code / Upload / DragDrop ─────────── */
    .text-area{width:100%;min-height:120px;padding:14px 18px;border:1.5px solid var(--border);border-radius:var(--radius-md);background:var(--surface);font:400 15px/1.65 var(--font-body);color:var(--fg);resize:vertical;transition:border-color .15s;margin-bottom:24px;}
    .text-area:focus{outline:none;border-color:var(--accent);}
    .text-area::placeholder{color:oklch(68% .01 250);}
    .code-wrap{margin-bottom:24px;border:1.5px solid oklch(30% .015 250);border-radius:var(--radius-md);overflow:hidden;}
    .code-head{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;background:oklch(26% .015 250);border-bottom:1px solid oklch(32% .015 250);}
    .code-lang{font:500 12px/1 var(--font-mono);color:oklch(68% .02 250);}
    .code-actions{display:flex;gap:8px;}
    .code-btn{font:500 11.5px/1 var(--font-body);color:oklch(62% .02 250);background:none;border:none;padding:4px 8px;border-radius:4px;transition:all .15s;}
    .code-btn:hover{color:oklch(85% .02 250);background:oklch(32% .015 250);}
    .code-edit{width:100%;min-height:160px;padding:16px 18px;background:oklch(22% .015 250);border:none;font:13.5px/1.65 var(--font-mono);color:oklch(88% .01 250);resize:vertical;tab-size:4;}
    .code-edit:focus{outline:none;}
    .code-edit::placeholder{color:oklch(45% .02 250);}
    .code-tests{padding:12px 18px;background:oklch(19% .012 250);border-top:1px solid oklch(30% .015 250);display:flex;align-items:center;gap:10px;}
    .code-tests-label{font:500 11.5px/1 var(--font-mono);color:oklch(55% .02 250);}
    .code-tests-val{font:400 12px/1.4 var(--font-mono);color:oklch(72% .02 250);}
    .upload{border:1.5px dashed var(--border);border-radius:var(--radius-md);padding:36px;text-align:center;transition:all .2s;margin-bottom:24px;cursor:pointer;}
    .upload:hover{border-color:var(--accent);background:var(--accent-subtle);}
    .upload-icon{margin-bottom:12px;opacity:.35;}
    .upload-text{font:400 14px/1.5 var(--font-body);color:var(--muted);margin-bottom:4px;}
    .upload-hint{font:400 12px/1 var(--font-body);color:oklch(68% .01 250);}
    .upload-formats{display:flex;gap:8px;justify-content:center;margin-top:14px;}
    .fmt{font:500 11px/1 var(--font-mono);padding:3px 8px;border-radius:4px;background:oklch(96% .003 250);color:var(--muted);border:1px solid var(--border);}
    .dd-zone{padding:18px;border:1.5px dashed var(--border);border-radius:var(--radius-md);background:oklch(98% .002 250);min-height:80px;margin-bottom:12px;transition:all .2s;}
    .dd-zone.over{border-color:var(--accent);background:var(--accent-subtle);}
    .dd-zone-label{font:500 12px/1 var(--font-body);color:var(--muted);margin-bottom:10px;}
    .dd-chips{display:flex;flex-wrap:wrap;gap:8px;}
    .dd-chip{padding:8px 16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);font:500 13px/1 var(--font-mono);color:var(--fg);cursor:grab;transition:all .15s;user-select:none;}
    .dd-chip:hover{border-color:var(--accent);}
    .dd-chip.placed{opacity:.4;cursor:default;}
    .dd-slots{display:flex;flex-direction:column;gap:8px;margin-bottom:24px;}
    .dd-slot{display:flex;align-items:center;gap:12px;padding:12px 16px;border:1.5px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);min-height:44px;}
    .dd-slot-label{font:500 12px/1 var(--font-body);color:var(--muted);flex-shrink:0;min-width:64px;}
    .dd-slot-chip{padding:6px 14px;border:1.5px solid var(--accent);border-radius:var(--radius-sm);background:var(--accent-subtle);font:500 13px/1 var(--font-mono);color:var(--accent);cursor:pointer;}

    /* ── Action bar ──────────────────────────────── */
    .action-bar{padding:14px 48px;border-top:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:space-between;flex-shrink:0;}
    .action-left{display:flex;align-items:center;gap:12px;}
    .btn-hint{display:flex;align-items:center;gap:6px;padding:8px 16px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--muted);font:500 13px/1 var(--font-body);transition:all .15s;}
    .btn-hint:hover{border-color:var(--warning);color:oklch(50% .12 80);}
    .btn-hint:disabled{opacity:.4;cursor:default;border-color:var(--border);color:var(--muted);}
    .hint-badge{width:18px;height:18px;border-radius:50%;background:var(--warning);color:#fff;display:grid;place-items:center;font:700 10px/1 var(--font-body);}
    .action-right{display:flex;gap:8px;}
    .btn-primary{padding:10px 28px;background:var(--accent);color:var(--accent-fg);border:none;border-radius:var(--radius-sm);font:600 14px/1 var(--font-body);transition:all .15s;}
    .btn-primary:hover{filter:brightness(1.08);}
    .btn-primary:disabled{opacity:.4;cursor:default;filter:none;}
    .btn-secondary{padding:10px 20px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);color:var(--fg);font:500 14px/1 var(--font-body);transition:all .15s;}
    .btn-secondary:hover{border-color:oklch(80% .02 250);}

    /* ══════════════════════════════════════════════
       RIGHT PANEL — Two-phase analysis
       ══════════════════════════════════════════════ */
    .analysis{display:flex;flex-direction:column;background:var(--surface);border-left:1px solid var(--border);overflow:hidden;}

    .phase-head{padding:18px 24px 14px;border-bottom:1px solid var(--border);flex-shrink:0;}
    .phase-badge{display:inline-flex;align-items:center;gap:6px;padding:5px 14px;border-radius:999px;font:600 12px/1 var(--font-mono);letter-spacing:0.04em;text-transform:uppercase;}
    .phase-badge.pre{background:var(--accent-subtle);color:var(--accent);border:1px solid oklch(88% .04 255);}
    .phase-badge.post-correct{background:var(--success-subtle);color:oklch(38% .12 155);border:1px solid oklch(82% .06 155);}
    .phase-badge.post-wrong{background:var(--danger-subtle);color:oklch(42% .16 25);border:1px solid oklch(82% .06 25);}
    .phase-badge svg{flex-shrink:0;}
    .phase-title{font:600 16px/1.3 var(--font-display);color:var(--fg);margin-top:12px;}
    .phase-sub{font:400 13px/1.5 var(--font-body);color:var(--muted);margin-top:4px;}

    .analysis-scroll{flex:1;overflow-y:auto;padding:20px 24px;}

    .a-section{margin-bottom:20px;}
    .a-section-title{font:600 12px/1 var(--font-mono);color:var(--muted);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
    .a-section-title svg{flex-shrink:0;opacity:.6;}
    .a-section-title::after{content:'';flex:1;height:1px;background:var(--border);}

    /* Pre-submission: Approach card */
    .approach-card{padding:16px;border:1px solid oklch(88% .04 255);border-radius:var(--radius-md);background:oklch(98% .008 255);}
    .approach-label{font:600 13px/1 var(--font-display);color:var(--accent);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
    .approach-text{font:400 13.5px/1.65 var(--font-body);color:oklch(38% .015 250);}

    /* Pre-submission: Hint cards */
    .hint-card{padding:14px 16px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);margin-bottom:8px;transition:all .2s;}
    .hint-card.locked{opacity:.45;border-style:dashed;}
    .hint-head{display:flex;align-items:center;gap:8px;margin-bottom:6px;}
    .hint-num{width:22px;height:22px;border-radius:50%;background:oklch(93% .02 80);color:oklch(50% .10 80);display:grid;place-items:center;font:600 11px/1 var(--font-mono);flex-shrink:0;}
    .hint-card.unlocked .hint-num{background:var(--warning-subtle);color:oklch(45% .12 80);}
    .hint-label{font:500 12px/1 var(--font-body);color:var(--muted);}
    .hint-text{font:400 13.5px/1.6 var(--font-body);color:oklch(35% .015 250);padding-left:30px;}
    .hint-locked-text{font:400 12.5px/1 var(--font-body);color:var(--muted);padding-left:30px;font-style:italic;}

    /* Pre-submission: Knowledge preview */
    .k-preview{display:flex;flex-direction:column;gap:8px;}
    .k-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--surface);transition:all .15s;}
    .k-item:hover{border-color:oklch(85% .03 250);}
    .k-icon{width:28px;height:28px;border-radius:6px;background:oklch(96% .008 250);display:grid;place-items:center;font-size:14px;flex-shrink:0;}
    .k-body{flex:1;}
    .k-name{font:600 13px/1 var(--font-display);color:var(--fg);}
    .k-desc{font:400 12px/1.5 var(--font-body);color:var(--muted);margin-top:3px;}

    /* Post-submission: Result banner */
    .result-banner{padding:20px;border-radius:var(--radius-md);margin-bottom:20px;display:flex;align-items:flex-start;gap:16px;}
    .result-banner.correct{background:var(--success-subtle);border:1.5px solid oklch(82% .06 155);}
    .result-banner.wrong{background:var(--danger-subtle);border:1.5px solid oklch(82% .06 25);}
    .result-icon{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;flex-shrink:0;}
    .result-banner.correct .result-icon{background:oklch(52% .15 155);}
    .result-banner.wrong .result-icon{background:oklch(56% .20 25);}
    .result-body{flex:1;}
    .result-verdict{font:700 18px/1.2 var(--font-display);margin-bottom:4px;}
    .result-banner.correct .result-verdict{color:oklch(35% .12 155);}
    .result-banner.wrong .result-verdict{color:oklch(40% .16 25);}
    .result-detail{font:400 13.5px/1.6 var(--font-body);color:oklch(35% .015 250);}
    .result-answer{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:4px 12px;border-radius:var(--radius-sm);font:600 13px/1 var(--font-mono);}
    .result-banner.correct .result-answer{background:oklch(90% .06 155);color:oklch(32% .10 155);}
    .result-banner.wrong .result-answer{background:oklch(90% .06 25);color:oklch(35% .14 25);}

    /* Post-submission: Steps */
    .steps-list{display:flex;flex-direction:column;gap:0;}
    .step-row{display:flex;gap:12px;padding:12px 0;position:relative;}
    .step-row+.step-row{border-top:1px solid oklch(94% .003 250);}
    .step-row::before{content:'';position:absolute;left:11px;top:36px;bottom:-2px;width:1.5px;background:var(--border);}
    .step-row:last-child::before{display:none;}
    .step-n{width:24px;height:24px;border-radius:50%;background:oklch(93% .01 250);color:var(--muted);display:grid;place-items:center;font:600 11px/1 var(--font-mono);flex-shrink:0;position:relative;z-index:1;}
    .step-row.key .step-n{background:var(--accent);color:var(--accent-fg);}
    .step-text{font:400 13.5px/1.6 var(--font-body);color:oklch(35% .015 250);padding-top:2px;}
    .step-row.key .step-text{color:var(--fg);font-weight:500;}
    .step-key-badge{font:500 10px/1 var(--font-mono);color:var(--accent);background:var(--accent-subtle);padding:2px 6px;border-radius:4px;margin-left:6px;vertical-align:middle;}

    /* Post-submission: Deep analysis */
    .deep-card{padding:16px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);}
    .deep-text{font:400 13.5px/1.7 var(--font-body);color:oklch(38% .015 250);}
    .deep-text strong{font-weight:600;color:var(--fg);}

    /* Post-submission: Pitfalls */
    .pitfall{display:flex;gap:10px;padding:10px 14px;border-radius:var(--radius-sm);background:oklch(97% .02 80);border:1px solid oklch(90% .04 80);margin-bottom:8px;}
    .pitfall-icon{flex-shrink:0;margin-top:1px;}
    .pitfall-text{font:400 13px/1.6 var(--font-body);color:oklch(38% .015 250);}

    /* Post-submission: Next steps */
    .next-actions{display:flex;flex-direction:column;gap:8px;margin-top:4px;}
    .next-btn{display:flex;align-items:center;gap:10px;padding:12px 16px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);color:var(--fg);font:500 13.5px/1 var(--font-body);transition:all .15s;text-align:left;}
    .next-btn:hover{border-color:var(--accent);background:var(--accent-subtle);}
    .next-btn-icon{width:28px;height:28px;border-radius:6px;background:oklch(96% .008 250);display:grid;place-items:center;flex-shrink:0;}
    .next-btn-text{flex:1;}
    .next-btn-arrow{color:var(--muted);font-size:14px;transition:transform .15s;}
    .next-btn:hover .next-btn-arrow{transform:translateX(2px);color:var(--accent);}

    /* ── Summary card ────────────────────────────── */
    .summary-card{padding:24px;border:1px solid var(--border);border-radius:var(--radius-md);background:var(--surface);text-align:center;}
    .summary-score{font:700 48px/1 var(--font-display);color:var(--fg);margin-bottom:4px;}
    .summary-label{font:400 13px/1 var(--font-body);color:var(--muted);margin-bottom:16px;}
    .summary-stats{display:flex;justify-content:center;gap:24px;margin-bottom:16px;}
    .summary-stat{text-align:center;}
    .summary-stat-val{font:600 18px/1 var(--font-display);color:var(--fg);}
    .summary-stat-label{font:400 11px/1 var(--font-body);color:var(--muted);margin-top:4px;}
    .summary-bar{height:6px;border-radius:3px;background:var(--border);overflow:hidden;margin-bottom:16px;}
    .summary-bar-fill{height:100%;border-radius:3px;transition:width .4s;}
    .summary-actions{display:flex;gap:8px;justify-content:center;margin-top:16px;}

    /* Scrollbars */
    ::-webkit-scrollbar{width:6px;}

      const qd = cur();

      if(qd.type === 'choice'){

        choice:{label:'选择题',icon:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="4" cy="4" r="2" stroke="currentColor" stroke-width="1.3"/><circle cx="4" cy="10" r="2" stroke="currentColor" stroke-width="1.3"/><path d="M8 4h5M8 10h5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>'},
        text:{label:'文字作答',icon:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 3h10M2 7h7M2 11h4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>'},
        code:{label:'代码编辑',icon:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M4 3L1 7l3 4M10 3l3 4-3 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>'},
        image:{label:'图片/手写',icon:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1.5" y="2.5" width="11" height="9" rx="1.5" stroke="currentColor" stroke-width="1.3"/><circle cx="5" cy="6" r="1.2" stroke="currentColor" stroke-width="1"/><path d="M1.5 10l3-3 2 2 3-3 3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>'},
        dragdrop:{label:'拖拽排列',icon:'<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><rect x="1" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="8" y="1" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="1" y="8" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/><rect x="8" y="8" width="5" height="5" rx="1" stroke="currentColor" stroke-width="1.3"/></svg>'}
      };
      var cm = curMode();
      document.getElementById('modeBar').innerHTML = qd.modes.map(function(m){
        var cfg = MODES[m];
        return '<button class="mode-tab ' + (m === cm ? 'active' : '') + '" data-mode="' + m + '">' + cfg.icon + '<span>' + cfg.label + '</span></button>';
      }).join('') + '<span class="mode-label">多模态输入</span>';
    }

    function renderInput(){
      var qd = cur();
      var m = curMode();
      var id = qId();
      var h = '';

      if(m === 'choice' && qd.choices){
        var ans = answers[id];
        h = '<div class="choices">' + qd.choices.map(function(c){
          var cls = 'choice';
          if(submitted[id]){
            if(c.correct) cls += ' correct';
            else if(ans === c.letter) cls += ' wrong';
          } else if(ans === c.letter) cls += ' selected';
          return '<div class="' + cls + '" data-letter="' + c.letter + '">' +
            '<div class="choice-letter">' + c.letter + '</div>' +
            '<div class="choice-body"><div class="choice-text">' + c.text + '</div>' +
            (c.sub ? '<div class="choice-sub">' + c.sub + '</div>' : '') +
            '</div></div>';
        }).join('') + '</div>';
      }
      else if(m === 'text'){
        h = '<textarea class="text-area" placeholder="在此输入你的答案…" ' + (submitted[id] ? 'disabled' : '') + '>' + (answers[id] || '') + '</textarea>';
      }
      else if(m === 'code'){
        h = '<div class="code-wrap">' +
          '<div class="code-head"><span class="code-lang">Python 3.11</span>' +
          '<div class="code-actions"><button class="code-btn">⟲ 重置</button><button class="code-btn">▶ 运行</button></div></div>' +
          '<textarea class="code-edit" placeholder="在此编写代码…" ' + (submitted[id] ? 'disabled' : '') + '>' + (answers[id] || '') + '</textarea>' +
          '<div class="code-tests"><span class="code-tests-label">测试用例</span><span class="code-tests-val">3 个隐藏用例 · 提交后自动评测</span></div>' +
          '</div>';
      }
      else if(m === 'image'){
        h = '<div class="upload">' +
          '<div class="upload-icon"><svg width="40" height="40" viewBox="0 0 40 40" fill="none"><rect x="4" y="8" width="32" height="24" rx="3" stroke="currentColor" stroke-width="2"/><path d="M4 26l8-8 6 6 8-8 10 10" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="14" cy="16" r="3" stroke="currentColor" stroke-width="2"/></svg></div>' +
          '<div class="upload-text">拍照上传手写答案，或截图粘贴草稿</div>' +
          '<div class="upload-hint">系统会自动识别手写内容并分析</div>' +
          '<div class="upload-formats"><span class="fmt">JPG</span><span class="fmt">PNG</span><span class="fmt">HEIC</span><span class="fmt">粘贴截图</span></div>' +
          '</div>';
      }
      else if(m === 'dragdrop' && qd.dragItems){
        var placed = answers[id] || {};
        var usedItems = Object.values(placed);
        h = '<div class="dd-zone" id="ddPool">' +
          '<div class="dd-zone-label">可用节点 — 拖到下方位置</div>' +
          '<div class="dd-chips">' + qd.dragItems.map(function(item){
            return '<div class="dd-chip ' + (usedItems.includes(item) ? 'placed' : '') + '" draggable="true" data-item="' + item + '">' + item + '</div>';
          }).join('') + '</div></div>' +
          '<div class="dd-slots">' + qd.dragSlots.map(function(slot, i){
            return '<div class="dd-slot" data-slot="' + i + '"><span class="dd-slot-label">' + slot + '</span>' +
              (placed[i] ? '<div class="dd-slot-chip" data-slot="' + i + '">' + placed[i] + ' ✕</div>' : '') +
              '</div>';
          }).join('') + '</div>';
      }

      document.getElementById('inputArea').innerHTML = h;
    }

    /* ══════════════════════════════════════════════
       RIGHT PANEL — Two-phase render
       ══════════════════════════════════════════════ */
    function renderPhase(){
      var qd = cur();
      var id = qId();
      var isSubmitted = submitted[id];

      // ── Phase header ──────────────────────────
      var headH = '';
      if(!isSubmitted){
        headH =
          '<div class="phase-badge pre">' +
            '<svg width="12" height="12" viewBox="0 0 12 12" fill="none"><circle cx="6" cy="6" r="4.5" stroke="currentColor" stroke-width="1.3"/><path d="M6 4v3l2 1" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>' +
            '答题中' +
          '</div>' +
          '<div class="phase-title">题目解析 · 准备阶段</div>' +
          '<div class="phase-sub">利用提示和知识预览梳理思路，然后提交答案</div>';
      } else {
        var correct = isCorrect();
        headH =
          '<div class="phase-badge ' + (correct ? 'post-correct' : 'post-wrong') + '">' +
            '<svg width="12" height="12" viewBox="0 0 12 12" fill="none">' +
              (correct
                ? '<path d="M2.5 6l2.5 2.5L9.5 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>'
                : '<path d="M3.5 3.5l5 5M8.5 3.5l-5 5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>') +
            '</svg>' +
            (correct ? '回答正确' : '回答错误') +
          '</div>' +
          '<div class="phase-title">题目解析 · 详解阶段</div>' +
          '<div class="phase-sub">理解解题思路，巩固相关知识点</div>';
      }
      document.getElementById('phaseHead').innerHTML = headH;

      // ── Phase content ─────────────────────────
      var h = '';

      // ── Summary (if all done) ─────────────────
      if(allDone()){
        var totalCorrect = questions.filter(function(q){
          if(q.type === 'choice'){
            var c = q.choices.find(function(x){ return x.correct; });
            return c && answers[q.id] === c.letter;
          }
          return false;
        }).length;
        var pct = Math.round((totalCorrect / questions.length) * 100);
        var elapsed = Math.round((Date.now() - startTime) / 1000);
        var mins = Math.floor(elapsed / 60);
        var secs = elapsed % 60;
        var barClass = pct >= 75 ? 'good' : pct >= 50 ? 'mid' : 'low';
        var barColor = pct >= 75 ? 'var(--success)' : pct >= 50 ? 'var(--warning)' : 'var(--danger)';

        h += '<div class="summary-card">' +
          '<div class="summary-score">' + totalCorrect + '/' + questions.length + '</div>' +
          '<div class="summary-label">本轮练习完成</div>' +
          '<div class="summary-bar"><div class="summary-bar-fill" style="width:' + pct + '%;background:' + barColor + '"></div></div>' +
          '<div class="summary-stats">' +
            '<div class="summary-stat"><div class="summary-stat-val">' + pct + '%</div><div class="summary-stat-label">正确率</div></div>' +
            '<div class="summary-stat"><div class="summary-stat-val">' + mins + ':' + (secs < 10 ? '0' : '') + secs + '</div><div class="summary-stat-label">用时</div></div>' +
            '<div class="summary-stat"><div class="summary-stat-val">' + Object.keys(hintsUsed).reduce(function(s,k){return s + hintsUsed[k];}, 0) + '</div><div class="summary-stat-label">使用提示</div></div>' +
          '</div>' +
          '<div class="summary-actions">' +
            '<a class="btn-secondary" href="刷题.html" style="display:inline-flex;align-items:center;gap:6px;text-decoration:none;padding:10px 20px;border:1px solid var(--border);border-radius:var(--radius-sm);font:500 14px/1 var(--font-body);color:var(--fg);">返回列表</a>' +
          '</div>' +
        '</div>';
        document.getElementById('phaseContent').innerHTML = h;
        document.getElementById('phaseContent').scrollTop = 0;
        return;
      }

      if(!isSubmitted){
        // ═══ PRE-SUBMISSION ═══
        if(qd.approach){
          h += '<div class="a-section"><div class="a-section-title"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1a4 4 0 014 4c0 1.5-1 2.5-1.5 3.5S9 11 9 11H5s-.5-1.5-1-2.5S3 6.5 3 5a4 4 0 014-4z" stroke="currentColor" stroke-width="1.2"/></svg>解题思路</div>' +
            '<div class="approach-card"><div class="approach-label"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7h10M7 2v10" stroke="var(--accent)" stroke-width="1.3" stroke-linecap="round"/></svg>建议思考方向</div><div class="approach-text">' + qd.approach + '</div></div></div>';
        }
        if(qd.hints && qd.hints.length > 0){
          var used = hintsUsed[id] || 0;
          h += '<div class="a-section"><div class="a-section-title"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="currentColor" stroke-width="1.2"/><path d="M7 5v3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><circle cx="7" cy="10" r=".6" fill="currentColor"/></svg>渐进提示 (' + used + '/' + qd.hints.length + ')</div>';
          qd.hints.forEach(function(hint, i){
            var unlocked = i < used;
            h += '<div class="hint-card ' + (unlocked ? 'unlocked' : 'locked') + '"><div class="hint-head"><div class="hint-num">' + (i+1) + '</div><span class="hint-label">' + (unlocked ? '提示 ' + (i+1) : '提示 ' + (i+1) + ' · 未解锁') + '</span></div>' +
              (unlocked ? '<div class="hint-text">' + hint + '</div>' : '<div class="hint-locked-text">点击底部「请求提示」逐步揭示</div>') + '</div>';
          });
          h += '</div>';
        }
        if(qd.knowledge){
          h += '<div class="a-section"><div class="a-section-title"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2h4v10H2zM8 2h4v10H8z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>关联知识预览</div><div class="k-preview">';
          qd.knowledge.forEach(function(k){
            h += '<div class="k-item"><div class="k-icon">' + k.icon + '</div><div class="k-body"><div class="k-name">' + k.title + '</div><div class="k-desc">' + k.desc + '</div></div></div>';
          });
          h += '</div></div>';
        }
      } else {
        // ═══ POST-SUBMISSION ═══
        var correct = isCorrect();
        var correctChoice = qd.choices ? qd.choices.find(function(c){ return c.correct; }) : null;
        var resultDetail = '';
        if(qd.type === 'choice' && correctChoice){
          resultDetail = correct
            ? '你正确选择了 <strong>' + answers[id] + '</strong>，对这个知识点掌握扎实。'
            : '你的选择是 <strong>' + (answers[id] || '未作答') + '</strong>，正确答案是 <strong>' + correctChoice.letter + '</strong>。';
        } else {
          resultDetail = correct ? '答案正确，继续保持良好的学习状态。' : '答案需要改进，仔细阅读下面的解题步骤。';
        }

        h += '<div class="result-banner ' + (correct ? 'correct' : 'wrong') + '">' +
          '<div class="result-icon"><svg width="22" height="22" viewBox="0 0 22 22" fill="none">' +
            (correct ? '<path d="M5 11l4 4L17 7" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>' : '<path d="M6 6l10 10M16 6L6 16" stroke="#fff" stroke-width="2.5" stroke-linecap="round"/>') +
          '</svg></div>' +
          '<div class="result-body"><div class="result-verdict">' + (correct ? '回答正确' : '回答错误') + '</div><div class="result-detail">' + resultDetail + '</div>' +
          (correctChoice ? '<div class="result-answer">正确答案：' + correctChoice.letter + ' · ' + correctChoice.text + '</div>' : '') +
          '</div></div>';

        if(qd.steps){
          h += '<div class="a-section"><div class="a-section-title"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7l3.5 3.5L12 4" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>解题步骤</div><div class="steps-list">';
          qd.steps.forEach(function(s, i){
            h += '<div class="step-row ' + (s.key ? 'key' : '') + '"><div class="step-n">' + (i+1) + '</div><div class="step-text">' + s.text + (s.key ? '<span class="step-key-badge">关键步骤</span>' : '') + '</div></div>';
          });
          h += '</div></div>';
        }
        if(qd.deepAnalysis){
          h += '<div class="a-section"><div class="a-section-title"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 4h10M2 7h7M2 10h4" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>深度解析</div><div class="deep-card"><div class="deep-text">' + qd.deepAnalysis + '</div></div></div>';
        }
        if(qd.pitfalls && qd.pitfalls.length > 0){
          h += '<div class="a-section"><div class="a-section-title"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2l5.5 10H1.5L7 2z" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M7 6v2.5" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/><circle cx="7" cy="10" r=".5" fill="currentColor"/></svg>常见误区</div>';
          qd.pitfalls.forEach(function(p){
            h += '<div class="pitfall"><div class="pitfall-icon"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="5.5" stroke="oklch(68% 0.14 80)" stroke-width="1.2"/><path d="M5 5l4 4M9 5l-4 4" stroke="oklch(68% 0.14 80)" stroke-width="1.2" stroke-linecap="round"/></svg></div><div class="pitfall-text">' + p + '</div></div>';
          });
          h += '</div>';
        }
        if(qd.knowledge){
          h += '<div class="a-section"><div class="a-section-title"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 2h4v10H2zM8 2h4v10H8z" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>关联知识点</div><div class="k-preview">';
          qd.knowledge.forEach(function(k){
            h += '<div class="k-item"><div class="k-icon">' + k.icon + '</div><div class="k-body"><div class="k-name">' + k.title + '</div><div class="k-desc">' + k.desc + '</div></div></div>';
          });
          h += '</div></div>';
        }
        if(qd.nextSteps && qd.nextSteps.length > 0){
          h += '<div class="a-section"><div class="a-section-title"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M2 7h10M9 4l3 3-3 3" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/></svg>推荐练习</div><div class="next-actions">';
          qd.nextSteps.forEach(function(ns){
            h += '<button class="next-btn"><div class="next-btn-icon"><svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M3 7h8M8 4l3 3-3 3" stroke="var(--accent)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><span class="next-btn-text">' + ns + '</span><span class="next-btn-arrow">→</span></button>';
          });
          h += '</div></div>';
        }
      }

      document.getElementById('phaseContent').innerHTML = h;
      document.getElementById('phaseContent').scrollTop = 0;
    }

    /* ── Master render ───────────────────────────── */
    function render(){
      renderProgress();
      renderHead();
      renderBody();
      renderModeBar();
      renderInput();
      renderPhase();
      updateHintBadge();
      updateActionBar();
      document.getElementById('qScroll').scrollTop = 0;
    }

    function updateHintBadge(){
      var used = hintsUsed[qId()] || 0;
      var badge = document.getElementById('hintBadge');
      badge.style.display = used > 0 ? 'grid' : 'none';
      badge.textContent = used;
    }

    function updateActionBar(){
      var id = qId();
      var btnHint = document.getElementById('btnHint');
      var btnSubmit = document.getElementById('btnSubmit');
      var used = hintsUsed[id] || 0;

      if(submitted[id]){
        btnHint.disabled = true;
        btnSubmit.textContent = '已提交';
        btnSubmit.disabled = true;
      } else {
        btnHint.disabled = used >= cur().hints.length;
        btnSubmit.textContent = '提交答案';
        btnSubmit.disabled = false;
      }
    }

    /* ── Events ───────────────────────────────────── */

    // Choice selection + DD chip remove
    document.getElementById('inputArea').addEventListener('click', function(e){
      var choice = e.target.closest('.choice');
      if(choice && !submitted[qId()]){
        answers[qId()] = choice.dataset.letter;
        renderInput();
      }
      var slotChip = e.target.closest('.dd-slot-chip');
      if(slotChip && !submitted[qId()]){
        delete answers[qId()][slotChip.dataset.slot];
        renderInput();
      }
    });

    // Drag-drop
    document.getElementById('inputArea').addEventListener('dragstart', function(e){
      if(e.target.classList.contains('dd-chip') && !e.target.classList.contains('placed')){
        e.dataTransfer.setData('text/plain', e.target.dataset.item);
      }
    });
    document.getElementById('inputArea').addEventListener('dragover', function(e){
      var slot = e.target.closest('.dd-slot');
      if(slot){ e.preventDefault(); slot.style.borderColor = 'var(--accent)'; slot.style.background = 'var(--accent-subtle)'; }
    });
    document.getElementById('inputArea').addEventListener('dragleave', function(e){
      var slot = e.target.closest('.dd-slot');
      if(slot){ slot.style.borderColor = ''; slot.style.background = ''; }
    });
    document.getElementById('inputArea').addEventListener('drop', function(e){
      e.preventDefault();
      var slot = e.target.closest('.dd-slot');
      if(slot && !submitted[qId()]){
        var item = e.dataTransfer.getData('text/plain');
        if(!answers[qId()]) answers[qId()] = {};
        answers[qId()][slot.dataset.slot] = item;
        slot.style.borderColor = ''; slot.style.background = '';
        renderInput();
      }
    });

    // Text / code input
    document.getElementById('inputArea').addEventListener('input', function(e){
      if(e.target.classList.contains('text-area') || e.target.classList.contains('code-edit')){
        answers[qId()] = e.target.value;
      }
    });

    // Mode tabs
    document.getElementById('modeBar').addEventListener('click', function(e){
      var tab = e.target.closest('.mode-tab');
      if(tab){ activeMode[qId()] = tab.dataset.mode; renderModeBar(); renderInput(); }
    });

    // Navigation
    document.getElementById('btnPrev').addEventListener('click', function(){ if(curIdx > 0){ curIdx--; render(); } });
    document.getElementById('btnNext').addEventListener('click', function(){ if(curIdx < questions.length - 1){ curIdx++; render(); } });

    // Skip
    document.getElementById('btnSkip').addEventListener('click', function(){
      if(curIdx < questions.length - 1){ curIdx++; render(); }
    });

    // Hint
    document.getElementById('btnHint').addEventListener('click', function(){
      var id = qId();
      var qd = cur();
      var used = hintsUsed[id] || 0;
      if(used < qd.hints.length){
        hintsUsed[id] = used + 1;
        renderPhase();
        updateHintBadge();
        updateActionBar();
      }
    });

    // Submit
    document.getElementById('btnSubmit').addEventListener('click', function(){
      var id = qId();
      if(submitted[id]) return;
      submitted[id] = true;
      render();
    });

    /* ── Init ─────────────────────────────────────── */
    render();
  </script>
</body>
</html>
