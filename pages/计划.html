  <style>

    /* ── Render a single message ──────────────────── */
    function renderMessage(m) {
      const isUser = m.role === 'user';
      const initials = isUser ? 'ZL' : 'AI';
      let html = `
        <div class="msg ${m.role}">
          <div class="msg-avatar">${initials}</div>
          <div class="msg-bubble">${m.text}`;

      if (m.modification) {
        html += `
            <div class="msg-modification">
              <div class="msg-modification-title">
                <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 1v12M1 7h12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>

                <button class="btn-reject" onclick="rejectMod(this)">拒绝</button>
              </div>
            </div>`;
      }

      html += `</div></div>`;
      return html;
    }

      const input = document.getElementById('aiInput');
      const text = input.value.trim();
      if (!text) return;

      const plan = plans.find(p => p.id === selectedPlanId);
      if (!plan) return;

      // Add user message
      plan.conversation.push({ role: 'user', text });
      input.value = '';
      input.style.height = 'auto';
      renderAIChat();

      // Show typing indicator
      const msgs = document.getElementById('aiMessages');
      const typingEl = document.createElement('div');
      typingEl.className = 'msg ai';

      typingEl.innerHTML = `

        <div class="msg-bubble"><div class="typing"><span></span><span></span><span></span></div></div>

      msgs.appendChild(typingEl);
      msgs.scrollTop = msgs.scrollHeight;

      // Simulate AI response
      setTimeout(() => {
        const indicator = document.getElementById('typingIndicator');
        if (indicator) indicator.remove();

        const response = generateResponse(text, plan);
        plan.conversation.push(response);
        renderAIChat();
      }, 1200 + Math.random() * 800);

    /* ── Accept / reject modifications ────────────── */
    function acceptMod(btn) {
      const container = btn.closest('.msg-modification');
      container.querySelector('.msg-modification-actions').innerHTML =
        '<span style="font:600 12px/1 var(--font-body);color:var(--success);">✓ 已采纳 — 计划已更新</span>';

      const plan = plans.find(p => p.id === selectedPlanId);
      if (plan && plan.items.length > 0) {
        const pending = plan.items.find(i => !i.done);
        if (pending) {
          const idx = plan.items.indexOf(pending);
          plan.items.splice(idx + 1, 0, {
            name: pending.name + '（练习篇）',
            desc: '基于上一节点的做题练习与自测',
            tag: '实践',
            type: 'quiz',
            done: false
          });
          plan.nodes = plan.items.length;
        }
      }

      setTimeout(() => {
        renderPlanDetail();
        renderAIChat();
      }, 600);
    }

    function rejectMod(btn) {
      const container = btn.closest('.msg-modification');
      container.querySelector('.msg-modification-actions').innerHTML =
        '<span style="font:500 12px/1 var(--font-body);color:var(--muted);">已拒绝</span>';
    }

    /* ── Ask AI to optimize ───────────────────────── */
    function askAI() {
      const input = document.getElementById('aiInput');
      input.value = '请帮我整体优化这份计划的学习顺序和内容安排';
      input.focus();
      sendMessage();
    }

    function reorderPlan() {
      const input = document.getElementById('aiInput');
      input.value = '请重新调整这些节点的学习顺序';
      input.focus();
      sendMessage();
    }

    /* ── Init ─────────────────────────────────────── */
    renderPlanDetail();
    renderAIChat();
  </script>
