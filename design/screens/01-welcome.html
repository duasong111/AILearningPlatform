<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>学径 LearnPath — 欢迎</title>
<link rel="stylesheet" href="../css/tokens.css" />
<style>
  body { background: var(--bg); overflow-x: hidden; }

  .welcome-top-bar {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: flex-end;
    align-items: center;
    gap: var(--sp-3);
    padding: var(--sp-5) var(--sp-8);
    z-index: 10;
  }
  .welcome-top-bar a {
    font-size: var(--text-sm);
    font-weight: 500;
    color: var(--fg-secondary);
    padding: var(--sp-2) var(--sp-4);
    border-radius: var(--r-md);
    transition: all 0.15s ease;
  }
  .welcome-top-bar a:hover { background: var(--surface-alt); text-decoration: none; }
  .welcome-top-bar .login-link {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--fg);
  }
  .welcome-top-bar .login-link:hover {
    border-color: var(--primary);
    color: var(--primary);
    background: var(--primary-light);
  }

  .welcome-hero {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: var(--sp-8);
    position: relative;
  }

  /* Subtle grid background */
  .welcome-hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle at 25% 30%, oklch(92% 0.04 255 / 0.4) 0%, transparent 50%),
      radial-gradient(circle at 75% 70%, oklch(92% 0.04 168 / 0.3) 0%, transparent 50%);
    pointer-events: none;
  }

  .brand-mark {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
    margin-bottom: var(--sp-12);
    position: relative;
  }
  .brand-icon {
    width: 56px; height: 56px;
    background: var(--primary);
    border-radius: var(--r-lg);
    display: grid;
    place-items: center;
    color: white;
    font-size: 28px;
    font-weight: 700;
    box-shadow: 0 8px 24px oklch(52% 0.18 255 / 0.3);
  }
  .brand-name {
    font-family: var(--font-display);
    font-size: var(--text-2xl);
    font-weight: 700;
    color: var(--fg);
  }
  .brand-name span { color: var(--muted); font-weight: 400; font-size: var(--text-lg); margin-left: var(--sp-2); }

  .hero-headline {
    font-family: var(--font-display);
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 700;
    line-height: 1.2;
    color: var(--fg);
    max-width: 680px;
    margin-bottom: var(--sp-6);
    position: relative;
    letter-spacing: -0.02em;
  }
  .hero-headline .highlight {
    background: linear-gradient(135deg, var(--primary), var(--ai));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .hero-sub {
    font-size: var(--text-lg);
    color: var(--fg-secondary);
    max-width: 520px;
    line-height: 1.7;
    margin-bottom: var(--sp-10);
    position: relative;
  }

  .hero-actions {
    display: flex;
    gap: var(--sp-4);
    position: relative;
  }
  .hero-actions .btn-primary { padding: var(--sp-3) var(--sp-10); font-size: var(--text-md); border-radius: var(--r-lg); }
  .hero-actions .btn-secondary { padding: var(--sp-3) var(--sp-8); }

  /* Feature pills */
  .feature-row {
    display: flex;
    gap: var(--sp-6);
    margin-top: var(--sp-16);
    position: relative;
    flex-wrap: wrap;
    justify-content: center;
  }
  .feature-pill {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-4);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-full);
    font-size: var(--text-sm);
    color: var(--fg-secondary);
  }
  .feature-pill .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
  }
  .dot-blue { background: var(--primary); }
  .dot-green { background: var(--secondary); }
  .dot-purple { background: var(--ai); }

  /* Floating orbs animation */
  .orb {
    position: absolute;
    border-radius: 50%;
    opacity: 0.12;
    animation: orb-float 12s ease-in-out infinite;
    pointer-events: none;
  }
  .orb-1 { width: 300px; height: 300px; background: var(--primary); top: 10%; left: -5%; animation-delay: 0s; }
  .orb-2 { width: 200px; height: 200px; background: var(--ai); bottom: 15%; right: -3%; animation-delay: 4s; }
  .orb-3 { width: 150px; height: 150px; background: var(--secondary); top: 60%; left: 80%; animation-delay: 8s; }

  @keyframes orb-float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33% { transform: translate(20px, -30px) scale(1.05); }
    66% { transform: translate(-15px, 15px) scale(0.95); }
  }

  @media (max-width: 600px) {
    .hero-headline { font-size: 1.75rem; }
    .hero-sub { font-size: var(--text-base); }
    .hero-actions { flex-direction: column; width: 100%; max-width: 320px; }
    .hero-actions .btn { width: 100%; }
    .feature-row { gap: var(--sp-3); }
  }
</style>
</head>
<body>
  <section class="welcome-hero">
    <div class="welcome-top-bar">
      <a href="00-auth.html" class="login-link">登录 / 注册</a>
    </div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>

    <div class="brand-mark anim-fade-up">
      <div class="brand-icon">学</div>
      <div class="brand-name">学径 <span>LearnPath</span></div>
    </div>

    <h1 class="hero-headline anim-fade-up anim-delay-1">
      你的专属 <span class="highlight">AI 学习教练</span><br />从这一刻开始
    </h1>

    <p class="hero-sub anim-fade-up anim-delay-2">
      多智能体协同 · 知识图谱驱动 · 多模态内容生成<br />
      为每位学习者构建科学、高效、可持续的个性化学习体系
    </p>

    <div class="hero-actions anim-fade-up anim-delay-3">
      <a href="02-subject-select.html" class="btn btn-primary btn-lg">开始学习之旅</a>
      <a href="#" class="btn btn-secondary btn-lg">了解更多</a>
    </div>

    <div class="feature-row anim-fade-up anim-delay-5">
      <div class="feature-pill"><div class="dot dot-blue"></div>7 大专业智能体</div>
      <div class="feature-pill"><div class="dot dot-green"></div>8 大学科领域</div>
      <div class="feature-pill"><div class="dot dot-purple"></div>多模态资源自动生成</div>
    </div>
  </section>
</body>
</html>
