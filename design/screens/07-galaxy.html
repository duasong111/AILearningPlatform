<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>学径 — 知识星图</title>
<link rel="stylesheet" href="../css/tokens.css" />
<style>
  body { background: oklch(14% 0.02 250); color: oklch(90% 0.01 240); }
  .page-wrap { min-height: 100vh; }

  /* Galaxy view */
  .galaxy-layout {
    display: flex;
    min-height: calc(100vh - var(--nav-h));
  }

  .galaxy-canvas {
    flex: 1;
    position: relative;
    overflow: hidden;
  }

  /* SVG knowledge graph */
  .galaxy-svg {
    width: 100%;
    height: 100%;
    min-height: calc(100vh - var(--nav-h));
  }

  /* Node styles */
  .node-circle {
    cursor: pointer;
    transition: all 0.3s ease;
  }
  .node-circle:hover { filter: brightness(1.3); }
  .node-label {
    font-family: var(--font-body);
    font-size: 11px;
    fill: oklch(80% 0.01 240);
    pointer-events: none;
  }
  .node-link {
    stroke: oklch(40% 0.02 250 / 0.3);
    stroke-width: 1;
    fill: none;
  }

  /* Glow effects */
  .node-glow {
    filter: url(#glow);
  }

  /* Detail panel */
  .galaxy-panel {
    width: 360px;
    background: oklch(16% 0.02 250);
    border-left: 1px solid oklch(25% 0.02 250);
    padding: var(--sp-6);
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: var(--sp-6);
  }
  .panel-header {
    display: flex;
    align-items: center;
    gap: var(--sp-3);
  }
  .panel-icon {
    width: 40px; height: 40px;
    border-radius: var(--r-md);
    display: grid;
    place-items: center;
    background: oklch(55% 0.20 280 / 0.15);
    color: oklch(72% 0.16 280);
  }
  .panel-title { font-weight: 600; font-size: var(--text-lg); color: oklch(92% 0.01 240); }
  .panel-sub { font-size: var(--text-xs); color: oklch(60% 0.01 240); }

  .panel-section {
    padding-top: var(--sp-4);
    border-top: 1px solid oklch(25% 0.02 250);
  }
  .panel-section-title {
    font-size: var(--text-xs);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: oklch(60% 0.01 240);
    margin-bottom: var(--sp-3);
  }

  .prereq-list {
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
  }
  .prereq-item {
    display: flex;
    align-items: center;
    gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-3);
    border-radius: var(--r-sm);
    background: oklch(20% 0.02 250);
    font-size: var(--text-sm);
    color: oklch(80% 0.01 240);
    cursor: pointer;
    transition: background 0.15s;
  }
  .prereq-item:hover { background: oklch(24% 0.02 250); }
  .prereq-status {
    width: 8px; height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .prereq-done { background: oklch(62% 0.16 155); }
  .prereq-progress { background: oklch(74% 0.14 80); }
  .prereq-locked { background: oklch(35% 0.02 250); }

  /* Legend */
  .galaxy-legend {
    position: absolute;
    bottom: var(--sp-6);
    left: var(--sp-6);
    display: flex;
    gap: var(--sp-5);
    font-size: var(--text-xs);
    color: oklch(60% 0.01 240);
  }
  .legend-item { display: flex; align-items: center; gap: var(--sp-2); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }
  .legend-mastered { background: oklch(62% 0.16 155); }
  .legend-learning { background: oklch(74% 0.14 80); }
  .legend-locked { background: oklch(35% 0.02 250); }

  /* Zoom controls */
  .zoom-controls {
    position: absolute;
    bottom: var(--sp-6);
    right: var(--sp-6);
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .zoom-btn {
    width: 36px; height: 36px;
    background: oklch(20% 0.02 250 / 0.9);
    backdrop-filter: blur(8px);
    border: 1px solid oklch(30% 0.02 250);
    color: oklch(80% 0.01 240);
    display: grid;
    place-items: center;
    font-size: 18px;
    transition: background 0.15s;
  }
  .zoom-btn:first-child { border-radius: var(--r-sm) var(--r-sm) 0 0; }
  .zoom-btn:last-child { border-radius: 0 0 var(--r-sm) var(--r-sm); }
  .zoom-btn:hover { background: oklch(28% 0.02 250); }

  /* Stats overlay */
  .galaxy-stats {
    position: absolute;
    top: var(--sp-6);
    left: var(--sp-6);
    display: flex;
    gap: var(--sp-4);
  }
  .g-stat {
    background: oklch(20% 0.02 250 / 0.85);
    backdrop-filter: blur(12px);
    border: 1px solid oklch(30% 0.02 250);
    border-radius: var(--r-md);
    padding: var(--sp-3) var(--sp-4);
  }
  .g-stat-val { font-weight: 700; font-size: var(--text-lg); color: oklch(92% 0.01 240); font-variant-numeric: tabular-nums; }
  .g-stat-label { font-size: var(--text-xs); color: oklch(55% 0.01 240); }

  /* Pulse animation for active node */
  @keyframes node-pulse {
    0%, 100% { r: 6; opacity: 1; }
    50% { r: 9; opacity: 0.7; }
  }

  @media (max-width: 900px) {
    .galaxy-panel { display: none; }
  }
</style>
</head>
<body>
  <div id="nav-slot" data-active="galaxy" style="background:oklch(14% 0.02 250 / 0.9);border-bottom-color:oklch(25% 0.02 250);"></div>
  <div class="page-wrap">
    <div class="galaxy-layout">
      <div class="galaxy-canvas">
        <!-- Stats -->
        <div class="galaxy-stats anim-fade-in">
          <div class="g-stat">
            <div class="g-stat-val">42 / 156</div>
            <div class="g-stat-label">节点已掌握</div>
          </div>
          <div class="g-stat">
            <div class="g-stat-val">27%</div>
            <div class="g-stat-label">知识覆盖率</div>
          </div>
          <div class="g-stat">
            <div class="g-stat-val">8</div>
            <div class="g-stat-label">进行中路径</div>
          </div>
        </div>

        <!-- Knowledge graph SVG -->
        <svg class="galaxy-svg" viewBox="0 0 900 700" preserveAspectRatio="xMidYMid meet">
          <defs>
            <filter id="glow">
              <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
              <feMerge>
                <feMergeNode in="coloredBlur"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
            <radialGradient id="bg-grad" cx="50%" cy="50%" r="50%">
              <stop offset="0%" style="stop-color:oklch(22% 0.04 250);stop-opacity:1"/>
              <stop offset="100%" style="stop-color:oklch(14% 0.02 250);stop-opacity:1"/>
            </radialGradient>
          </defs>

          <!-- Background -->
          <rect width="900" height="700" fill="url(#bg-grad)"/>

          <!-- Subtle star particles -->
          <circle cx="120" cy="80" r="1" fill="oklch(80% 0 0 / 0.3)"/>
          <circle cx="780" cy="120" r="1.5" fill="oklch(80% 0 0 / 0.2)"/>
          <circle cx="340" cy="650" r="1" fill="oklch(80% 0 0 / 0.25)"/>
          <circle cx="680" cy="50" r="1" fill="oklch(80% 0 0 / 0.15)"/>
          <circle cx="50" cy="400" r="1.5" fill="oklch(80% 0 0 / 0.2)"/>
          <circle cx="850" cy="500" r="1" fill="oklch(80% 0 0 / 0.3)"/>

          <!-- Links / edges -->
          <g class="links">
            <!-- Foundations cluster -->
            <line class="node-link" x1="200" y1="300" x2="300" y2="250"/>
            <line class="node-link" x1="200" y1="300" x2="280" y2="380"/>
            <line class="node-link" x1="300" y1="250" x2="400" y2="220"/>
            <line class="node-link" x1="300" y1="250" x2="380" y2="320"/>
            <line class="node-link" x1="280" y1="380" x2="380" y2="320"/>
            <line class="node-link" x1="280" y1="380" x2="350" y2="450"/>

            <!-- ML cluster -->
            <line class="node-link" x1="400" y1="220" x2="500" y2="180"/>
            <line class="node-link" x1="380" y1="320" x2="480" y2="280"/>
            <line class="node-link" x1="500" y1="180" x2="480" y2="280"/>
            <line class="node-link" x1="500" y1="180" x2="580" y2="200"/>
            <line class="node-link" x1="480" y1="280" x2="580" y2="200"/>
            <line class="node-link" x1="480" y1="280" x2="560" y2="360"/>
            <line class="node-link" x1="350" y1="450" x2="450" y2="480"/>

            <!-- DL cluster -->
            <line class="node-link" x1="580" y1="200" x2="680" y2="160"/>
            <line class="node-link" x1="580" y1="200" x2="660" y2="260"/>
            <line class="node-link" x1="560" y1="360" x2="660" y2="260"/>
            <line class="node-link" x1="560" y1="360" x2="640" y2="420"/>
            <line class="node-link" x1="680" y1="160" x2="750" y2="220"/>
            <line class="node-link" x1="660" y1="260" x2="750" y2="220"/>
            <line class="node-link" x1="660" y1="260" x2="720" y2="340"/>
            <line class="node-link" x1="640" y1="420" x2="720" y2="340"/>

            <!-- Advanced cluster -->
            <line class="node-link" x1="450" y1="480" x2="540" y2="520"/>
            <line class="node-link" x1="540" y1="520" x2="640" y2="420"/>
            <line class="node-link" x1="540" y1="520" x2="620" y2="560"/>
            <line class="node-link" x1="620" y1="560" x2="720" y2="500"/>
            <line class="node-link" x1="720" y1="340" x2="720" y2="500"/>
          </g>

          <!-- Nodes — Foundations (mastered) -->
          <g class="nodes">
            <circle class="node-circle node-glow" cx="200" cy="300" r="12" fill="oklch(62% 0.16 155)"/>
            <text class="node-label" x="200" y="325" text-anchor="middle">Python 基础</text>

            <circle class="node-circle node-glow" cx="300" cy="250" r="10" fill="oklch(62% 0.16 155)"/>
            <text class="node-label" x="300" y="235" text-anchor="middle">NumPy</text>

            <circle class="node-circle node-glow" cx="280" cy="380" r="9" fill="oklch(62% 0.16 155)"/>
            <text class="node-label" x="280" y="400" text-anchor="middle">线性代数</text>

            <!-- Nodes — ML basics (learning) -->
            <circle class="node-circle node-glow" cx="400" cy="220" r="11" fill="oklch(74% 0.14 80)">
              <animate attributeName="r" values="11;13;11" dur="3s" repeatCount="indefinite"/>
            </circle>
            <text class="node-label" x="400" y="205" text-anchor="middle">监督学习</text>

            <circle class="node-circle node-glow" cx="380" cy="320" r="9" fill="oklch(74% 0.14 80)"/>
            <text class="node-label" x="380" y="340" text-anchor="middle">损失函数</text>

            <circle class="node-circle node-glow" cx="350" cy="450" r="8" fill="oklch(74% 0.14 80)"/>
            <text class="node-label" x="350" y="470" text-anchor="middle">无监督学习</text>

            <!-- Nodes — ML methods (learning) -->
            <circle class="node-circle node-glow" cx="500" cy="180" r="10" fill="oklch(74% 0.14 80)"/>
            <text class="node-label" x="500" y="165" text-anchor="middle">逻辑回归</text>

            <circle class="node-circle node-glow" cx="480" cy="280" r="9" fill="oklch(74% 0.14 80)">
              <animate attributeName="r" values="9;11;9" dur="4s" repeatCount="indefinite"/>
            </circle>
            <text class="node-label" x="480" y="300" text-anchor="middle">梯度下降</text>

            <circle class="node-circle" cx="450" cy="480" r="7" fill="oklch(74% 0.14 80 / 0.6)"/>
            <text class="node-label" x="450" y="498" text-anchor="middle" style="font-size:10px">K-Means</text>

            <!-- Nodes — DL (locked/partial) -->
            <circle class="node-circle" cx="580" cy="200" r="8" fill="oklch(50% 0.10 280 / 0.6)"/>
            <text class="node-label" x="580" y="218" text-anchor="middle" style="font-size:10px">神经网络</text>

            <circle class="node-circle" cx="560" cy="360" r="7" fill="oklch(50% 0.10 280 / 0.5)"/>
            <text class="node-label" x="560" y="378" text-anchor="middle" style="font-size:10px">反向传播</text>

            <circle class="node-circle" cx="680" cy="160" r="7" fill="oklch(35% 0.02 250)"/>
            <text class="node-label" x="680" y="178" text-anchor="middle" style="font-size:10px">CNN</text>

            <circle class="node-circle" cx="660" cy="260" r="6" fill="oklch(35% 0.02 250)"/>
            <text class="node-label" x="660" y="278" text-anchor="middle" style="font-size:10px">RNN</text>

            <circle class="node-circle" cx="750" cy="220" r="6" fill="oklch(35% 0.02 250)"/>
            <text class="node-label" x="750" y="238" text-anchor="middle" style="font-size:10px">Attention</text>

            <circle class="node-circle" cx="720" cy="340" r="5" fill="oklch(35% 0.02 250)"/>
            <text class="node-label" x="720" y="358" text-anchor="middle" style="font-size:10px">Transformer</text>

            <circle class="node-circle" cx="640" cy="420" r="5" fill="oklch(35% 0.02 250)"/>
            <text class="node-label" x="640" y="438" text-anchor="middle" style="font-size:10px">GAN</text>

            <circle class="node-circle" cx="540" cy="520" r="5" fill="oklch(35% 0.02 250)"/>
            <text class="node-label" x="540" y="538" text-anchor="middle" style="font-size:10px">Autoencoder</text>

            <circle class="node-circle" cx="620" cy="560" r="4" fill="oklch(35% 0.02 250)"/>
            <text class="node-label" x="620" y="578" text-anchor="middle" style="font-size:10px">强化学习</text>

            <circle class="node-circle" cx="720" cy="500" r="4" fill="oklch(35% 0.02 250)"/>
            <text class="node-label" x="720" y="518" text-anchor="middle" style="font-size:10px">迁移学习</text>
          </g>

          <!-- Cluster labels -->
          <text x="240" y="190" fill="oklch(45% 0.02 250 / 0.6)" font-size="13" font-weight="600" font-family="var(--font-body)">基础</text>
          <text x="430" y="140" fill="oklch(45% 0.02 250 / 0.6)" font-size="13" font-weight="600" font-family="var(--font-body)">机器学习</text>
          <text x="650" y="120" fill="oklch(45% 0.02 250 / 0.6)" font-size="13" font-weight="600" font-family="var(--font-body)">深度学习</text>
          <text x="560" y="610" fill="oklch(45% 0.02 250 / 0.6)" font-size="13" font-weight="600" font-family="var(--font-body)">高级主题</text>
        </svg>

        <!-- Legend -->
        <div class="galaxy-legend">
          <div class="legend-item"><div class="legend-dot legend-mastered"></div>已掌握</div>
          <div class="legend-item"><div class="legend-dot legend-learning"></div>学习中</div>
          <div class="legend-item"><div class="legend-dot legend-locked"></div>未解锁</div>
        </div>

        <!-- Zoom -->
        <div class="zoom-controls">
          <button class="zoom-btn">+</button>
          <button class="zoom-btn">−</button>
        </div>
      </div>

      <!-- Detail panel -->
      <aside class="galaxy-panel">
        <div class="panel-header">
          <div class="panel-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
          </div>
          <div>
            <div class="panel-title">梯度下降法</div>
            <div class="panel-sub">机器学习 · 核心概念 · 预计 2 小时</div>
          </div>
        </div>

        <div class="panel-section">
          <div class="panel-section-title">学习进度</div>
          <div class="progress" style="height:8px;background:oklch(25% 0.02 250)">
            <div class="progress-fill" style="width:65%;background:oklch(74% 0.14 80)"></div>
          </div>
          <div style="font-size:var(--text-xs);color:oklch(55% 0.01 240);margin-top:var(--sp-2)">65% — 还需完成 3 个练习</div>
        </div>

        <div class="panel-section">
          <div class="panel-section-title">前置知识</div>
          <div class="prereq-list">
            <div class="prereq-item">
              <div class="prereq-status prereq-done"></div>
              <span>微积分基础</span>
              <span class="badge badge-success" style="margin-left:auto">已掌握</span>
            </div>
            <div class="prereq-item">
              <div class="prereq-status prereq-done"></div>
              <span>线性代数</span>
              <span class="badge badge-success" style="margin-left:auto">已掌握</span>
            </div>
            <div class="prereq-item">
              <div class="prereq-status prereq-done"></div>
              <span>损失函数</span>
              <span class="badge badge-success" style="margin-left:auto">已掌握</span>
            </div>
          </div>
        </div>

        <div class="panel-section">
          <div class="panel-section-title">后续节点</div>
          <div class="prereq-list">
            <div class="prereq-item">
              <div class="prereq-status prereq-progress"></div>
              <span>Adam 优化器</span>
            </div>
            <div class="prereq-item">
              <div class="prereq-status prereq-locked"></div>
              <span>反向传播算法</span>
            </div>
            <div class="prereq-item">
              <div class="prereq-status prereq-locked"></div>
              <span>学习率调度</span>
            </div>
          </div>
        </div>

        <div class="panel-section" style="border-top:none;padding-top:0;">
          <a href="05-tutor.html" class="btn btn-primary" style="width:100%;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
            继续学习此节点
          </a>
        </div>
      </aside>
    </div>
  </div>
  <script src="../js/nav.js"></script>
</body>
</html>
