<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>学径 — AI 教学工坊</title>
<link rel="stylesheet" href="../css/tokens.css" />
<style>
  body { background: var(--bg); }
  .page-wrap { min-height: 100vh; }
  .page-body { padding: var(--sp-8) var(--sp-6); max-width: var(--content-max); margin: 0 auto; }

  .page-header {
    display: flex; align-items: flex-end; justify-content: space-between;
    margin-bottom: var(--sp-8);
  }
  .page-header h1 { font-family: var(--font-display); font-size: var(--text-2xl); font-weight: 700; }
  .page-header-sub { font-size: var(--text-sm); color: var(--muted); margin-top: var(--sp-1); }

  /* Generation input */
  .gen-input-section {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-xl); padding: var(--sp-6);
    margin-bottom: var(--sp-8);
  }
  .gen-input-row {
    display: flex; gap: var(--sp-3); align-items: flex-end;
  }
  .gen-input {
    flex: 1;
    padding: var(--sp-3) var(--sp-4);
    border: 1px solid var(--border);
    border-radius: var(--r-md);
    background: var(--bg);
    font-size: var(--text-base);
    outline: none;
    resize: none;
    min-height: 44px;
  }
  .gen-input:focus { border-color: var(--ai); }
  .gen-input::placeholder { color: var(--muted); }

  .gen-type-select {
    display: flex; gap: var(--sp-2); margin-top: var(--sp-4); flex-wrap: wrap;
  }
  .gen-type-btn {
    display: flex; align-items: center; gap: var(--sp-2);
    padding: var(--sp-2) var(--sp-4);
    border: 1px solid var(--border);
    border-radius: var(--r-full);
    font-size: var(--text-sm);
    color: var(--fg-secondary);
    transition: all 0.15s;
  }
  .gen-type-btn:hover { border-color: var(--ai); color: var(--ai); }
  .gen-type-btn.active { background: var(--ai-light); border-color: var(--ai); color: var(--ai); }
  .gen-type-btn svg { width: 16px; height: 16px; }

  /* Resource grid */
  .section-title {
    font-size: var(--text-lg); font-weight: 600;
    margin-bottom: var(--sp-5);
    display: flex; align-items: center; gap: var(--sp-2);
  }

  .resource-grid {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-4);
    margin-bottom: var(--sp-8);
  }
  .resource-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--r-lg); overflow: hidden;
    transition: all 0.2s;
  }
  .resource-card:hover { box-shadow: var(--shadow-md); transform: translateY(-2px); }

  .rc-preview {
    height: 140px;
    display: grid; place-items: center;
    position: relative;
    overflow: hidden;
  }
  .rc-preview-doc { background: linear-gradient(135deg, oklch(96% 0.01 240), oklch(92% 0.02 240)); }
  .rc-preview-ppt { background: linear-gradient(135deg, var(--primary-light), oklch(94% 0.04 255)); }
  .rc-preview-mind { background: linear-gradient(135deg, var(--ai-light), oklch(94% 0.04 280)); }
  .rc-preview-video { background: linear-gradient(135deg, oklch(20% 0.02 240), oklch(25% 0.03 240)); }
  .rc-preview-card { background: linear-gradient(135deg, var(--secondary-light), oklch(94% 0.04 168)); }
  .rc-preview-lab { background: linear-gradient(135deg, var(--warning-light), oklch(94% 0.04 80)); }

  .rc-preview-icon { font-size: 36px; opacity: 0.6; }
  .rc-preview .rc-badge {
    position: absolute;
    top: var(--sp-3); right: var(--sp-3);
    padding: 2px 8px; border-radius: var(--r-full);
    font-size: 10px; font-weight: 600;
  }
  .rc-badge-ready { background: var(--success-light); color: var(--success); }
  .rc-badge-gen { background: var(--ai-light); color: var(--ai); }

  .rc-body { padding: var(--sp-4); }
  .rc-title { font-weight: 600; font-size: var(--text-base); margin-bottom: var(--sp-1); }
  .rc-meta { font-size: var(--text-xs); color: var(--muted); display: flex; gap: var(--sp-3); }

  /* Generating card */
  .generating-overlay {
    position: absolute; inset: 0;
    background: oklch(100% 0 0 / 0.85);
    backdrop-filter: blur(4px);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: var(--sp-3);
  }
  .gen-spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--ai-light);
    border-top-color: var(--ai);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .gen-text { font-size: var(--text-sm); color: var(--ai); font-weight: 500; }
  .gen-progress { width: 120px; height: 3px; background: var(--ai-light); border-radius: var(--r-full); overflow: hidden; }
  .gen-progress-fill {
    height: 100%; background: var(--ai); border-radius: var(--r-full);
    animation: gen-fill 3s ease-in-out infinite;
  }
  @keyframes gen-fill {
    0% { width: 0%; }
    50% { width: 70%; }
    100% { width: 100%; }
  }

  @media (max-width: 768px) {
    .resource-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
  <div id="nav-slot" data-active="studio"></div>
  <div class="page-wrap">
    <div class="page-body">
      <div class="page-header anim-fade-up">
        <div>
          <h1>AI 教学工坊</h1>
          <div class="page-header-sub">多模态教学资源自动生成 · 因人而异的教学内容</div>
        </div>
      </div>

      <!-- Generation input -->
      <div class="gen-input-section anim-fade-up anim-delay-1">
        <div class="gen-input-row">
          <textarea class="gen-input" placeholder="输入知识点或主题，AI 将自动生成教学资源…&#10;例如：为「决策树算法」生成一套完整的教学资料" rows="2"></textarea>
          <button class="btn btn-primary btn-lg" style="background:var(--ai);white-space:nowrap;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
            生成资源
          </button>
        </div>
        <div class="gen-type-select">
          <button class="gen-type-btn active">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
            学习讲义
          </button>
          <button class="gen-type-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
            PPT 课件
          </button>
          <button class="gen-type-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></svg>
            思维导图
          </button>
          <button class="gen-type-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="23 7 16 12 23 17 23 7"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>
            讲解视频
          </button>
          <button class="gen-type-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
            知识卡片
          </button>
          <button class="gen-type-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/></svg>
            实验指导
          </button>
        </div>
      </div>

      <!-- Resources -->
      <div class="section-title anim-fade-up anim-delay-2">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><polyline points="13 2 13 9 20 9"/></svg>
        已生成的资源
      </div>
      <div class="resource-grid">
        <!-- Card 1: Generating -->
        <div class="resource-card anim-fade-up anim-delay-2" style="position:relative;">
          <div class="rc-preview rc-preview-mind">
            <div class="rc-preview-icon">◈</div>
            <span class="rc-badge rc-badge-gen">生成中</span>
            <div class="generating-overlay">
              <div class="gen-spinner"></div>
              <div class="gen-text">AI 正在生成思维导图</div>
              <div class="gen-progress"><div class="gen-progress-fill"></div></div>
            </div>
          </div>
          <div class="rc-body">
            <div class="rc-title">决策树算法 — 思维导图</div>
            <div class="rc-meta"><span>思维导图</span><span>正在生成…</span></div>
          </div>
        </div>

        <!-- Card 2 -->
        <div class="resource-card anim-fade-up anim-delay-3">
          <div class="rc-preview rc-preview-ppt">
            <div class="rc-preview-icon">▦</div>
            <span class="rc-badge rc-badge-ready">已完成</span>
          </div>
          <div class="rc-body">
            <div class="rc-title">线性回归与最小二乘法</div>
            <div class="rc-meta"><span>PPT 课件</span><span>18 页</span><span>昨天生成</span></div>
          </div>
        </div>

        <!-- Card 3 -->
        <div class="resource-card anim-fade-up anim-delay-4">
          <div class="rc-preview rc-preview-video">
            <div class="rc-preview-icon" style="color:white">▶</div>
            <span class="rc-badge rc-badge-ready">已完成</span>
          </div>
          <div class="rc-body">
            <div class="rc-title">神经网络前向传播 — 动画讲解</div>
            <div class="rc-meta"><span>视频</span><span>12 分钟</span><span>3 天前</span></div>
          </div>
        </div>

        <!-- Card 4 -->
        <div class="resource-card anim-fade-up anim-delay-3">
          <div class="rc-preview rc-preview-doc">
            <div class="rc-preview-icon">📄</div>
            <span class="rc-badge rc-badge-ready">已完成</span>
          </div>
          <div class="rc-body">
            <div class="rc-title">卷积神经网络 — 学习讲义</div>
            <div class="rc-meta"><span>讲义</span><span>24 页</span><span>上周</span></div>
          </div>
        </div>

        <!-- Card 5 -->
        <div class="resource-card anim-fade-up anim-delay-4">
          <div class="rc-preview rc-preview-lab">
            <div class="rc-preview-icon">⚗</div>
            <span class="rc-badge rc-badge-ready">已完成</span>
          </div>
          <div class="rc-body">
            <div class="rc-title">Scikit-learn 分类器实验</div>
            <div class="rc-meta"><span>实验指导</span><span>含代码模板</span><span>上周</span></div>
          </div>
        </div>

        <!-- Card 6 -->
        <div class="resource-card anim-fade-up anim-delay-5">
          <div class="rc-preview rc-preview-card">
            <div class="rc-preview-icon">▢</div>
            <span class="rc-badge rc-badge-ready">已完成</span>
          </div>
          <div class="rc-body">
            <div class="rc-title">机器学习核心概念卡片集</div>
            <div class="rc-meta"><span>知识卡片</span><span>36 张</span><span>上周</span></div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../js/nav.js"></script>
</body>
</html>
